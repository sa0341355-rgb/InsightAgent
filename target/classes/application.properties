# Server
server.port=${SERVER_PORT:8080}

# Application
spring.application.name=spring-ai-agent

# Redis configuration for vector store
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Mistral AI - Chat
spring.ai.mistralai.api-key=${MISTRAL-API-KEY}
spring.ai.mistralai.chat.options.temperature=0.2
spring.ai.mistralai.chat.options.model=mistral-large-latest

# Mistral AI - Embedding
spring.ai.mistralai.embedding.api-key=${MISTRAL-API-KEY}
spring.ai.mistralai.embedding.options.model=mistral-embed

# Vector Store - Redis
spring.ai.vectorstore.redis.initialize-schema=true
spring.ai.vectorstore.redis.index-name=my-redis-index
spring.ai.vectorstore.redis.prefix=sample

# MCP Client
spring.ai.mcp.client.name=spring-ai-mcp-client
spring.ai.mcp.client.description=A Spring AI MCP client for github.
spring.ai.mcp.client.tool-callbacks-enabled=true
spring.ai.mcp.client.streamable.connections.github-mcp.url=https://api.github.com
spring.ai.mcp.client.streamable.connections.github-mcp.endpoint=/mcp

# GitHub API key — used by MCPClientCustomizaton (not a native MCP connection property)
github.mcp.api-key=${GITHUB-API-KEY}

# Logging
logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG

